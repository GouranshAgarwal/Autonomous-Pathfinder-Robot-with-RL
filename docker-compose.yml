version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robot_backend_container
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=production

  frontend:
    build:
      context: ./robot-sandbox-ui
      dockerfile: Dockerfile
    container_name: robot_frontend_container
    ports:
      - "3000:80"  # Maps host port 3000 to Nginx container port 80
    depends_on:
      - backend